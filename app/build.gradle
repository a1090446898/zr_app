apply plugin: 'com.android.application'
apply plugin: 'com.huawei.agconnect'

android {
    compileSdkVersion 30
    defaultConfig {
        applicationId "com.gsoft.inventory"
        minSdkVersion 23
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 30
        versionCode 325
        versionName "3.2.5"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        multiDexEnabled true
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    packagingOptions {
        exclude 'AndroidManifest.xml'
    }
    // 产品风味，dimension 是 flavor 的维度，用于区分不同的产品风味
    flavorDimensions "company"
    productFlavors {
        mainFlavor {
            dimension "company"
            applicationId "com.gsoft.inventory"
            resValue "string", "app_name", "资产管理"
        }
        companyKaiYang {
            dimension "company"
            applicationId "com.gsoft.inventory"
            resValue "string", "app_name", "开检通"
        }

        companyYJS {
            dimension "company"
            applicationId "com.gsoft.inventory"
            resValue "string", "app_name", "资产管理"
        }
    }

    // 添加签名配置
    signingConfigs {
        release {
            // 请替换为你的签名文件路径
            storeFile file('D:\\ZR\\zc_app\\zc_app\\keystore.jks')
            // 请替换为你的签名文件密码
            storePassword 'gsc666666'
            // 请替换为你的密钥别名
            keyAlias 'gsoft'
            // 请替换为你的密钥密码
            keyPassword 'gsc666666'
        }
    }
    buildTypes {
        debug {
            // 确保 debug 构建类型是可调试的
            debuggable true
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

        }
    }


    sourceSets {
        main {
//            jniLibs.srcDirs = ['libs']
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        // 不检查所有警告
        checkAllWarnings false
        // 不检查发布版本
        checkReleaseBuilds false
        // 发现错误时不终止构建
        abortOnError false
        // 忽略多个 Lint 检查项
        disable 'MissingTranslation', 'UnusedResources', 'NewApi'
    }

    // 固定 APK 输出文件名，避免版本号变化后旧 APK 残留导致 IDE 同步失败
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "app-${variant.name}.apk"
        }
    }
}


dependencies {

    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation files('libs/LPAPI-2021-02-02-R.jar')
    implementation files('libs/platform_sdk_v4.0.0802.jar')
    implementation files('libs/DeviceAPI_ver20241125_release.aar')
    implementation files('libs/CDFPSKAndroid.jar')
    implementation files('libs/IGLBarDecoder.jar')

    // 核心依赖
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.1'
    implementation 'com.google.guava:guava:31.1-android'

    // PDF预览
    implementation 'com.github.barteksc:android-pdf-viewer:2.8.2'

    // webView
    implementation 'androidx.webkit:webkit:1.6.1'

    // 引入华为扫码
    implementation 'com.huawei.hms:scanplus:2.12.0.301'

    // 发送角标，适配主流手机系统
    implementation 'me.leolin:ShortcutBadger:1.1.22@aar'

    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'


    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.0'


    implementation 'com.qmuiteam:qmui:1.4.4'
    implementation 'com.github.satyan:sugar:1.5'

    implementation 'com.contrarywind:Android-PickerView:4.1.6'
    implementation 'com.jakewharton:butterknife:10.2.3'
    implementation 'com.scwang.smartrefresh:SmartRefreshLayout:1.0.5.1'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'
    //implementation files('libs/universal-image-loader-1.9.5.jar')
    implementation 'com.github.bumptech.glide:glide:4.9.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.9.0'
    implementation 'com.squareup.okhttp3:okhttp:3.10.0'
    implementation 'com.zhy:okhttputils:2.6.2'
    implementation 'com.google.code.gson:gson:2.8.5'
    implementation 'com.github.chrisbanes:PhotoView:2.0.0'

//    implementation 'com.github.chrisbanes:PhotoView:462338'
//    implementation 'com.jess.arms:arms:2.3.4'
//    implementation 'com.jess.arms:arms-base:2.3.4'
//    implementation 'com.jess.arms:arms-utils:2.3.4'

    implementation 'com.github.xuexiangjys:XUpdate:2.0.4'
    implementation 'id.zelory:compressor:2.1.1'

    implementation "com.github.permissions-dispatcher:permissionsdispatcher:4.9.2"
    annotationProcessor "com.github.permissions-dispatcher:permissionsdispatcher-processor:4.9.2"
    implementation('com.journeyapps:zxing-android-embedded:4.3.0')
}
